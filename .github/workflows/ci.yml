name: Python CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run tests
        run: python test_app.py

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Simulate Deployment
        run: |
          echo "🚀 Starting deployment..."
          echo "✅ Tests passed!"
          echo "📦 Deploying app.py to production..."
          echo "🎉 Deployment successful!"
